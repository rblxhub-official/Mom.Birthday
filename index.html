<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Mom! 💖</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 45px 35px;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 30px rgba(255, 107, 129, 0.5);
            max-width: 400px;
            width: 90%;
            z-index: 10;
            position: relative;
            border: 4px solid #ff6b81;
        }

        h1 {
            color: #ff4757;
            margin-bottom: 20px;
            font-size: 26px;
            text-transform: uppercase;
        }

        .emoji-header {
            font-size: 50px;
            margin-bottom: 15px;
        }

        button {
            background: linear-gradient(45deg, #ff4757, #ff6b81, #ffa502);
            color: white;
            border: none;
            padding: 18px 36px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.6);
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        /* Cutscene Screen */
        #cutscene {
            display: none;
            margin-top: 20px;
        }

        #cutsceneText {
            font-size: 20px;
            color: #302b63;
            font-weight: bold;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeInOut 0.8s infinite alternate;
        }

        /* Final Birthday Message */
        #message {
            display: none;
            margin-top: 25px;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        #message h2 {
            color: #2ed573;
            font-size: 34px;
            margin-bottom: 5px;
        }

        #message p {
            color: #ff4757;
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.3); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeInOut {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="emoji-header">💖 🎉 🎂 🌟</div>
        <h1>Mom's Ultimate Surprise</h1>
        
        <!-- The Click Here Button -->
        <button id="surpriseBtn" onclick="startCutscene()">Click Here</button>

        <!-- The Cutscene Sequence -->
        <div id="cutscene">
            <div id="cutsceneText">🎬 Preparing surprise...</div>
        </div>

        <!-- The Final Birthday Message -->
        <div id="message">
            <h2>Happy Birthday to you Mom!</h2>
            <p>By Ting Xi</p>
        </div>
    </div>

    <script>
        function startCutscene() {
            // Hide the button and show the cutscene area
            document.getElementById('surpriseBtn').style.display = 'none';
            document.getElementById('cutscene').style.display = 'block';

            const textElem = document.getElementById('cutsceneText');

            // Cinematic Cutscene Timeline
            setTimeout(() => {
                textElem.innerHTML = "✨ Gathering all the love...";
            }, 1200);

            setTimeout(() => {
                textElem.innerHTML = "🤗 Adding extra hugs and kisses...";
            }, 2600);

            setTimeout(() => {
                textElem.innerHTML = "🎂 Baking the digital cake...";
            }, 4000);

            setTimeout(() => {
                textElem.innerHTML = "🎉 Ready! Here it comes...";
            }, 5400);

            // Hide cutscene and show final message after 6.5 seconds
            setTimeout(() => {
                document.getElementById('cutscene').style.display = 'none';
                document.getElementById('message').style.display = 'block';
            }, 6800);
        }
    </script>

</body>
</html>
